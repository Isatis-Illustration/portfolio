<!-- ═══════════════════════════════════════════
     HERO — due colonne: presentazione a sinistra, autoritratto a destra
     ═══════════════════════════════════════════ -->
<section class="relative w-full px-6 pt-8 pb-10 md:pt-14 md:pb-16 overflow-hidden">
  <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-[1.15fr_0.85fr] items-center gap-10 md:gap-6">

    <!-- Presentazione -->
    <div class="flex flex-col items-center md:items-start text-center md:text-left gap-5">

      <span class="animate-hero-entrance inline-block px-4 py-1 rounded-full bg-verde-pastello/60 text-title
                   font-fredoka text-xs sm:text-sm font-semibold uppercase tracking-wider">
        Isatis Illustration
      </span>

      <!-- Nome: GIF mode -->
      <div *ngIf="useGifName" class="hero-name animate-hero-entrance w-full max-w-md lg:max-w-lg">
        <img [src]="nameGif" alt="Isabella" class="select-none w-full mb-4" />
        <img [src]="lNameGif" alt="Laurenzi" class="select-none w-full -mt-2 sm:-mt-4" />
      </div>

      <!-- Nome: Testo Fredoka mode -->
      <h1 *ngIf="!useGifName"
        class="animate-hero-entrance font-fredoka text-5xl md:text-7xl font-bold text-title tracking-tight">
        Isabella Laurenzi
      </h1>

      <!-- Sottotitolo -->
      <div class="w-40 sm:w-48 animate-hero-entrance" style="animation-delay: 150ms; opacity: 0;">
        <img [src]="subTitle()" alt="Illustratrice" class="w-full select-none">
      </div>

      <p class="animate-hero-entrance font-quicksand text-title/75 text-lg leading-relaxed max-w-md"
        style="animation-delay: 250ms; opacity: 0;">
        {{ 'HOME_BIO_SHORT' | translate }}
      </p>

      <!-- CTA: azione principale piena, secondaria a contorno -->
      <div class="animate-hero-entrance flex flex-wrap items-center justify-center md:justify-start gap-3 sm:gap-4 mt-1"
        style="animation-delay: 350ms; opacity: 0;">
        <button (click)="navigate('personal-projects')" class="px-7 py-3 rounded-full bg-verde-scuro text-white font-fredoka font-medium text-lg
                 shadow-[0_6px_20px_rgba(129,199,132,0.35)]
                 hover:-translate-y-0.5 hover:shadow-[0_10px_26px_rgba(129,199,132,0.45)]
                 active:scale-95 transition-all duration-300 cursor-pointer">
          {{ 'PERSONAL_PROJECTS' | translate }}
        </button>
        <button (click)="navigate('gallery')" class="px-7 py-3 rounded-full bg-white text-title font-fredoka font-medium text-lg
                 border-2 border-crema-scuro shadow-[0_4px_16px_rgba(0,0,0,0.04)]
                 hover:border-arancione hover:-translate-y-0.5
                 active:scale-95 transition-all duration-300 cursor-pointer">
          {{ 'GALLERY' | translate }}
        </button>
      </div>
    </div>

    <!-- Autoritratto illustrato in una finestra ad arco: il bordo dritto del disegno poggia sul fondo -->
    <div class="flex justify-center md:justify-end animate-hero-entrance" style="animation-delay: 200ms; opacity: 0;">
      <div class="relative w-64 sm:w-72 md:w-80 lg:w-96">
        <div class="hero-arch relative w-full aspect-[4/5]">
          <img src="assets/personal/artist-char.png" alt="Isabella Laurenzi"
            class="hero-portrait absolute bottom-0 left-1/2 w-[118%] max-w-none select-none" />
        </div>
        <img src="assets/stickers/sticker_flower.png" alt="" aria-hidden="true"
          class="hero-sticker absolute -top-4 -right-4 w-16 sm:w-20 select-none" />
      </div>
    </div>

  </div>
</section>

<div *ngIf="toastMessage()" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 animate-fade-in-up">
  <div
    class="flex items-center gap-3 px-6 py-3 rounded-full bg-title text-white font-quicksand font-medium text-sm sm:text-base shadow-2xl border border-white/20">
    <span class="text-lg">📁</span>
    <span>Cartella <b>{{ toastMessage() }}</b>: {{ 'FOLDER_COMING_SOON' | translate }}</span>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     COLLABORAZIONI — bustine di feltro, nella fascia in fondo (al posto di "Esplora il portfolio";
     mt-auto: resta sopra il footer). Durante il caricamento mostra solo il loader;
     senza collaborazioni l'intera sezione sparisce.
     ═══════════════════════════════════════════ -->
<section *ngIf="isLoading() || projects().length" class="mt-auto bg-[#fff2c8] py-10 md:py-14">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Section Title & Subtitle -->
    <div *ngIf="!isLoading()" class="text-center mb-2">
      <h2 class="font-fredoka text-3xl md:text-5xl font-bold text-title tracking-tight">
        {{ 'HOME_COLLAB_TITLE' | translate }}
      </h2>
      <p class="mt-3 text-title/70 font-quicksand text-base sm:text-lg max-w-2xl mx-auto">
        {{ 'HOME_COLLAB_SUBTITLE' | translate }}
      </p>
    </div>

    <!-- Definizione filtri SVG texture feltro e clipPath -->
    <svg width="0" height="0" class="absolute pointer-events-none" aria-hidden="true">
      <filter id="feltro" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" />
        <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .4  0 0 0 .55 -.08" />
      </filter>
      <clipPath id="cf">
        <path d="M0,40C60,10 110,30 150,34C190,30 240,10 300,40L300,112Q300,150 258,150L42,150Q0,150 0,112Z" />
      </clipPath>
    </svg>

    <!-- Loader finché i progetti non sono arrivati dal BE -->
    <div *ngIf="isLoading()" class="flex items-center justify-center py-24">
      <div class="loader"></div>
    </div>

    <!-- Progetti a Sacchetto di Feltro: centratura dinamica (1 centro, 2 centrati, 3+ griglia da sinistra) -->
    <div *ngIf="!isLoading()" [ngClass]="gridClass()">

      <div *ngFor="let p of projects(); let pi = index"
        class="pouch-wrapper select-none flex flex-col items-center w-full max-w-sm" [style.--back]="p.colors.back"
        [style.--front]="p.colors.front" [style.--stitch]="p.colors.stitch"
        [class.is-toggled]="toggledFolder() === p.key" (click)="handleBlobClick(p.key)" tabindex="0" role="button"
        [attr.aria-label]="p.title">

        <div class="pouch">
          <!-- Ombra inferiore morbida -->
          <div class="shadow"></div>

          <!-- Pannello posteriore in feltro -->
          <div class="back"></div>

          <!-- Foto polaroid o immagini raw che sbucano dalla tasca e vanno a ventaglio -->
          <div *ngFor="let img of p.images; let i = index; trackBy: trackById" class="card"
            [class.no-card]="img.hasBg === false" [style]="p.fan[i]">
            <ng-container *ngIf="img.hasBg !== false; else rawImage">
              <div class="photo">
                <img [src]="img.imageUrl" [alt]="img.title" loading="lazy" />
              </div>
            </ng-container>
            <ng-template #rawImage>
              <div class="photo-raw">
                <img [src]="img.imageUrl" [alt]="img.title" loading="lazy" />
              </div>
            </ng-template>
          </div>

          <!-- Tasca frontale in feltro con cuciture e bordo scavato -->
          <svg class="front" viewBox="0 0 300 150" aria-hidden="true">
            <path d="M0,40C60,10 110,30 150,34C190,30 240,10 300,40L300,112Q300,150 258,150L42,150Q0,150 0,112Z"
              fill="var(--front)" />
            <rect width="300" height="150" filter="url(#feltro)" clip-path="url(#cf)" opacity=".5" />
            <path d="M14,50C62,28 112,46 150,50C188,46 238,28 286,50L286,112Q286,137 258,137L42,137Q14,137 14,112Z"
              fill="none" stroke="var(--stitch)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"
              opacity=".9" />
          </svg>

          <!-- Informazioni sul sacchetto frontale (Titolo e Descrizione perfettamente centrati) -->
          <div class="pouch-content z-10 pointer-events-auto">
            <h3 class="font-fredoka text-xl sm:text-2xl font-bold text-title leading-tight">
              {{ p.title }}
            </h3>
            <p class="font-quicksand text-xs sm:text-sm text-title/75 mt-1 max-w-[220px] truncate">
              {{ p.shortText }}
            </p>
          </div>
        </div>

        <!-- Etichetta cucita che spunta da sotto la bustina: su telefono dopo il primo tocco (invito a toccare
             di nuovo), su PC al passaggio del mouse -->
        <button type="button" class="pouch-open-cta" (click)="onFolderClick(p.key, $event)"
          [attr.tabindex]="toggledFolder() === p.key ? 0 : -1" [attr.aria-hidden]="toggledFolder() !== p.key">
          {{ 'EXPLORE_PROJECT' | translate }}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
          </svg>
        </button>

      </div>
    </div>
  </div>
</section>
