<div class="relative w-full h-full overflow-hidden bg-crema flex flex-col">

  <!-- Top bar editoriale fissa in alto -->
  <header
    class="flex-shrink-0 z-30 flex items-center justify-between px-4 sm:px-8 py-3 bg-crema/90 backdrop-blur-md border-b border-black/5 pointer-events-auto">
    <!-- Torna alla pagina da cui si è aperto il progetto (Home o Progetti Personali) -->
    <button (click)="goBack()" type="button"
      class="group inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/80 hover:bg-white text-title shadow-sm border border-black/5 transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer"
      [attr.aria-label]="backLabel | translate">
      <svg class="w-4 h-4 transition-transform duration-200 group-hover:-translate-x-1" fill="none"
        stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
      </svg>
      <span class="font-fredoka text-xs sm:text-sm font-medium">{{ backLabel | translate }}</span>
    </button>

    <!-- Titolo del progetto oppure logo -->
    <div class="flex items-center gap-2 sm:gap-3 text-center">

      <div class="flex flex-col items-center">
        <!-- Titolo o Foto nel Viewer (se c'è immagine/logo mostra l'immagine, altrimenti il titolo) -->
        <img *ngIf="currentMeta().headerImageUrl; else textTitle"
          [src]="currentMeta().headerImageUrl"
          [alt]="currentMeta().title"
          class="h-7 sm:h-9 max-w-[180px] sm:max-w-[240px] object-contain select-none" />

        <ng-template #textTitle>
          <h1 class="font-barriecito text-xl sm:text-2xl md:text-3xl font-bold text-title tracking-wide">
            {{ currentMeta().title }}
          </h1>
        </ng-template>

      </div>
    </div>

    <!-- Page Counter Pill -->
    <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/80 border border-black/5 shadow-sm">
      <span class="font-fredoka text-xs sm:text-sm font-bold text-verde-scuro">
        {{ (currentPage() + 1) < 10 ? '0' + (currentPage() + 1) : (currentPage() + 1) }} </span>
          <span class="text-title/30 text-xs">/</span>
          <span class="font-fredoka text-xs sm:text-sm text-title/60 font-medium">
            {{ totalPages() < 10 ? '0' + totalPages() : totalPages() }} </span>
    </div>
  </header>

  <!-- Viewport a scorrimento verticale con Scroll-Snap -->
  <main #viewport (scroll)="onViewportScroll()" (scrollend)="onViewportScrollEnd()" class="project-reader-viewport flex-1 w-full overflow-y-auto"
    [class.has-bar]="totalPages() > 1">

    <div *ngFor="let page of pages(); let i = index" #slideItem [attr.data-index]="i"
      class="project-page-slide flex-shrink-0 w-full h-full flex flex-col items-center justify-center p-2 sm:p-4 md:p-6 relative box-border">

      <!-- Foglio: la cornice bianca segue le proporzioni dell'immagine (vedi .sheet-canvas nel CSS) -->
      <article
        [class.no-card]="page.hasBg === false"
        class="project-sheet relative flex flex-col items-center bg-white rounded-2xl sm:rounded-3xl shadow-[0_16px_40px_rgba(0,0,0,0.08)] border border-black/5 overflow-hidden transition-all duration-300 box-border">

        <!-- Immagine zoomabile dentro la cornice (pinch / Ctrl+rotella / doppio tap, trascina per spostare) -->
        <div appZoomPan [appZoomPan]="currentPage() === i" [style.--ratio]="ratio(i)"
          class="sheet-canvas relative flex items-center justify-center rounded-xl sm:rounded-2xl bg-crema/40 overflow-hidden">
          <img [src]="page.imageUrl" [alt]="page.title" loading="eager" draggable="false" (load)="onImageLoad(i, $event)"
            class="w-full h-full object-contain select-none" />
        </div>

        <!-- Barra inferiore del foglio editoriale -->
        <footer
          class="sheet-footer flex-shrink-0 w-full flex items-center justify-between px-1 text-title/70 font-quicksand text-xs sm:text-sm">
          <span class="font-semibold text-title truncate max-w-[70%]">
          </span>
          <span class="font-fredoka text-[11px] font-bold text-verde-scuro uppercase tracking-wider">
            Tavola {{ i + 1 }}
          </span>
        </footer>
      </article>

      <!-- Indicatore visivo di scroll intuitivo sulla prima pagina (scompare dopo lo scroll) -->
      <div *ngIf="i === 0 && !hasUserScrolled()"
        class="scroll-hint absolute bottom-3 left-1/2 -translate-x-1/2 z-20 pointer-events-none flex flex-col items-center gap-1.5 text-title/60 transition-opacity duration-500">
        <div class="mouse-icon w-5 h-8 rounded-full border-2 border-title/40 flex justify-center pt-1.5 shadow-sm">
          <div class="wheel w-1 h-2 bg-verde-scuro rounded-full animate-bounce"></div>
        </div>
        <svg class="w-4 h-4 text-title/50 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
        </svg>
      </div>

    </div>

  </main>

  <!-- Scrollbar personalizzata galleggiante sul lato destro -->
  <aside *ngIf="totalPages() > 1" (wheel)="onAsideWheel($event)"
    class="custom-scrollbar fixed z-40 flex items-center select-none pointer-events-auto">

    <!-- Tasto pagina precedente (freccia su da PC, sinistra da telefono) -->
    <button (click)="prevPage()" [disabled]="currentPage() === 0"
      class="bar-arrow p-1.5 rounded-full text-title/60 hover:text-title hover:bg-white/80 disabled:opacity-20 disabled:pointer-events-none transition-all duration-200 cursor-pointer"
      aria-label="Pagina precedente">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7" />
      </svg>
    </button>

    <!-- Traccia con le tappe e la goccia: tocca una tappa o trascina il dito lungo la traccia.
         Da PC è verticale (26px a tappa, max 60% dello schermo), da telefono orizzontale a tutta larghezza -->
    <div #track class="page-track relative flex items-center justify-between"
      [style.--track-len]="'min(' + totalPages() * 26 + 'px, 60vh)'"
      (pointerdown)="onTrackPointerDown($event)" (pointermove)="onTrackPointerMove($event)"
      (pointerup)="onTrackPointerUp($event)" (pointercancel)="onTrackPointerUp($event)">

      <!-- Linea di fondo: dal centro della prima tappa al centro dell'ultima -->
      <div class="track-line"></div>

      <!-- Goccia verde che sguscia tra le tappe, sotto i numeri -->
      <div class="droplet-indicator" [ngClass]="{
             'moving-down': isMoving() && moveDirection() === 'down',
             'moving-up': isMoving() && moveDirection() === 'up'
           }" [style.--pos]="dropletTop()">
      </div>

      <!-- Tappe: numero in un cerchietto bianco; sulla tappa attiva il cerchietto lascia vedere la goccia -->
      <button *ngFor="let p of pages(); let idx = index" (click)="scrollToPage(idx)" type="button"
        class="page-stop relative z-20 w-5 h-5 cursor-pointer flex items-center justify-center p-0 bg-transparent border-0 outline-none"
        [class.active]="currentPage() === idx"
        [attr.aria-label]="'Vai a pagina ' + (idx + 1)" [attr.aria-current]="currentPage() === idx ? 'page' : null">
        <span class="page-dot">{{ idx + 1 }}</span>
      </button>

    </div>

    <!-- Tasto pagina successiva -->
    <button (click)="nextPage()" [disabled]="currentPage() === totalPages() - 1"
      class="bar-arrow p-1.5 rounded-full text-title/60 hover:text-title hover:bg-white/80 disabled:opacity-20 disabled:pointer-events-none transition-all duration-200 cursor-pointer"
      aria-label="Pagina successiva">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

  </aside>

</div>
