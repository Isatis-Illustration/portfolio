<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">

  <!-- Header Galleria centrato identico a Progetti Personali -->
  <header class="text-center mb-12 sm:mb-16">
    <h1 class="font-barriecito text-3xl sm:text-4xl md:text-5xl text-title font-bold tracking-wide mb-3">
      {{ 'GALLERY' | translate }}
    </h1>
    <p class="font-quicksand text-base sm:text-lg text-title/70 max-w-2xl mx-auto">
      {{ 'GALLERY_SUBTITLE' | translate }}
    </p>
  </header>

  <!-- Masonry grid with row-to-column order -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div *ngFor="let col of columns(); let colIdx = index" class="flex flex-col gap-6">
      <div *ngFor="let c of col; trackBy: trackById; let i = index"
           class="animate-fade-in-up"
           [style.animation-delay]="((colIdx + i * columnsCount()) * 60) + 'ms'"
           [style.opacity]="0">
        <app-card
          [content]="c"
          [isCharacter]="isCharacterItem(c)"
          (onClickImageEvent)="openImageViewer($event)">
        </app-card>
      </div>
    </div>
  </div>

</section>
