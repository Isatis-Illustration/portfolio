<form [formGroup]="userForm" (ngSubmit)="onSubmit()"
      class="form-card flex flex-col gap-5 p-6 sm:p-8 rounded-3xl bg-white border-2 border-crema-scuro
             shadow-[0_10px_30px_rgba(0,0,0,0.05)]">

  <div>
    <h2 class="font-fredoka text-2xl font-semibold text-title">{{ 'FORM_TITLE' | translate }}</h2>
    <p class="font-quicksand text-sm text-title/60 mt-1">{{ 'FORM_REQUIRED_NOTE' | translate }}</p>
  </div>

  <!-- Nome + Email affiancati da tablet in su -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
    <label class="field">
      <span class="field-label">{{ 'FORM_NAME' | translate }}</span>
      <input formControlName="name" autocomplete="name" class="field-input" />
    </label>

    <label class="field">
      <span class="field-label">{{ 'FORM_EMAIL' | translate }}</span>
      <input formControlName="email" type="email" autocomplete="email" class="field-input"
             [class.is-invalid]="!isRequiredValid('email')" />
      <span *ngIf="!isRequiredValid('email')" class="field-error">{{ 'FORM_EMAIL_ERROR' | translate }}</span>
    </label>
  </div>

  <label class="field">
    <span class="field-label">{{ 'FORM_SUBJECT' | translate }}</span>
    <input formControlName="subject" class="field-input" />
  </label>

  <label class="field">
    <span class="field-label">{{ 'FORM_MESSAGE' | translate }}</span>
    <textarea formControlName="message" rows="6" class="field-input resize-none"
              [class.is-invalid]="!isRequiredValid('message')"></textarea>
    <span *ngIf="!isRequiredValid('message')" class="field-error">{{ 'FORM_MESSAGE_ERROR' | translate }}</span>
  </label>

  <!-- Esito invio -->
  <p *ngIf="formFeedback" class="feedback" [class.is-error]="formFeedback === 'FORM_ERROR'" role="status">
    {{ formFeedback | translate }}
  </p>

  <button type="submit" [disabled]="isButtonDisabled()"
    class="w-full py-3.5 rounded-full bg-verde-scuro text-white font-fredoka font-medium text-lg
           shadow-[0_6px_20px_rgba(129,199,132,0.35)]
           hover:-translate-y-0.5 hover:shadow-[0_10px_26px_rgba(129,199,132,0.45)]
           active:scale-[0.98] transition-all duration-300 cursor-pointer
           disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none">
    {{ getSendText() | translate }}
  </button>

  <p class="font-quicksand text-xs text-title/60 text-center leading-relaxed">
    {{ 'FORM_PRIVACY_NOTE' | translate }}
    <button type="button" (click)="goToPolicy()" class="underline hover:text-verde-scuro cursor-pointer">
      {{ 'FORM_PRIVACY_LINK' | translate }}
    </button>.
  </p>
</form>
