<section class="w-full px-6 pt-10 pb-14 md:pt-16 md:pb-20">
  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-[0.9fr_1.1fr] gap-10 lg:gap-14 items-start">

    <!-- ── Info ── -->
    <div class="flex flex-col items-center lg:items-start text-center lg:text-left gap-6">

      <img [src]="contactImg()" alt="{{ 'CONTACTS' | translate }}" class="w-full max-w-xs sm:max-w-sm select-none" />

      <p class="font-quicksand text-lg text-title/80 leading-relaxed max-w-md">
        {{ 'CONTACT_INTRO' | translate }}
      </p>

      <!-- Email in evidenza -->
      <a [href]="'mailto:' + user().email.email" class="group inline-flex items-center gap-3 px-5 py-3 rounded-2xl bg-white border-2 border-crema-scuro
                shadow-[0_6px_20px_rgba(0,0,0,0.04)] hover:border-verde-scuro hover:-translate-y-0.5
                transition-all duration-200 max-w-full">
        <span class="contact-icon bg-verde-pastello/70" [innerHTML]="getIcon('contacts')"></span>
        <span class="flex flex-col items-start min-w-0">
          <span class="font-quicksand text-xs text-title/60">{{ 'CONTACT_EMAIL_LABEL' | translate }}</span>
          <span class="font-fredoka font-semibold text-title truncate max-w-[16rem] sm:max-w-none">{{ user().email.email
            }}</span>
        </span>
      </a>

      <!-- Social nella palette del sito -->
      <div class="flex flex-wrap justify-center lg:justify-start gap-3">
        <a [href]="user().instagram.link" target="_blank" rel="noopener noreferrer" class="soft-chip">
          <span [innerHTML]="getIcon('instagram')" class="chip-icon"></span>
          {{ user().instagram.nick }}
        </a>
        <a [href]="user().telegram.link" target="_blank" rel="noopener noreferrer" class="soft-chip">
          <span [innerHTML]="getIcon('telegram')" class="chip-icon"></span>
          {{ user().telegram.nick }}
        </a>
      </div>
    </div>

    <!-- ── Form ── -->
    <div class="w-full">
      <app-contacts-form></app-contacts-form>
    </div>

  </div>
</section>
