<div class="flex flex-col bg-crema" [ngClass]="isDetailRoute() ? 'h-full h-[100dvh] max-h-[100dvh] overflow-hidden' : 'min-h-screen'">
  <!-- Top Navigation -->
  <app-top-nav></app-top-nav>

  <!-- Main Content (con background SVG) -->
  <main class="flex-1 min-h-0 relative overflow-hidden flex flex-col main-content">
    <div class="relative flex-1 min-h-0 flex flex-col h-full overflow-hidden">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Footer -->
  <app-footer *ngIf="!isDetailRoute()"></app-footer>
</div>
